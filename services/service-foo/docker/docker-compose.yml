services:
  postgres:
    image: postgres:15
    container_name: service-foo-postgres
    environment:
      - POSTGRES_DB=service_foo
      - POSTGRES_USER=service_foo
      - POSTGRES_PASSWORD=service_foo
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data

  service-foo:
    image: service-foo:0.0.0
    container_name: service-foo
    ports:
      - 8080:8080
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/service_foo
      - SPRING_DATASOURCE_USERNAME=service_foo
      - SPRING_DATASOURCE_PASSWORD=service_foo
    logging:
      driver: fluentd
      options:
        fluentd-address: 127.0.0.1:24224
        fluentd-async: "true"
        tag: "{{.Name}}"

    depends_on:
      - postgres

  fluent-bit:
    image: cr.fluentbit.io/fluent/fluent-bit:latest
    container_name: fluent-bit
    ports:
      - 24224:24224
    volumes:
      - ./fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
    depends_on:
      elasticsearch:
        condition: service_healthy

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - 127.0.0.1:9200:9200
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200 > /dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data: