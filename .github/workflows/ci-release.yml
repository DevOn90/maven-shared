name: ci-release

on:
    push:
        tags:
            - 'lib-*-v*.*.*'

jobs:
    verify:
        uses: ./.github/workflows/ci-verify.yml

    publish:
        needs: verify
        runs-on: ubuntu-latest

        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up JDK 17
              uses: actions/setup-java@v4
              with:
                  java-version: 17
                  distribution: temurin
                  server-id: github
                  server-username: GITHUB_ACTOR    # Check how to use GitHub Actions secrets
                  server-password: GITHUB_TOKEN    # Check how to use GitHub Actions secrets

            - name: Read release tag
              run: |
                 TAG="${GITHUB_REF_NAME}"

                 echo "Release tag: $TAG"
                 LIBRARY="${TAG%-v*}"
                 VERSION="${TAG##*-v}"
                 echo "Library: $LIBRARY"
                 echo "Version: $VERSION"
                 echo "Library path: libs/$LIBRARY"
            
            - name: Publish to GitHub Packages
              working-directory: libs/$LIBRARY          # This seams to be wrong if i use other library path
              run: ./mvnw deploy
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

