name: ci-release

on:
    push:
        tags:
            - 'lib-*-v*'

jobs:
    release-info:
        runs-on: ubuntu-latest

        outputs:
            library: ${{ steps.release.outputs.library }}
            version: ${{ steps.release.outputs.version }}

        steps:
            - name: Read release tag
              id: release
              run: |
                  TAG="${GITHUB_REF_NAME}"

                  echo "Release tag: $TAG"

                  LIBRARY="${TAG%-v*}"
                  VERSION="${TAG##*-v}"

                  echo "Library: $LIBRARY"
                  echo "Version: $VERSION"

                  echo "library=$LIBRARY" >> "$GITHUB_OUTPUT"
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    verify:
        needs: release-info

        uses: ./.github/workflows/ci-verify.yml

        with:
            library: ${{ needs.release-info.outputs.library }}

    publish:
        needs:
            - release-info
            - verify

        runs-on: ubuntu-latest

        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up JDK 17
              uses: actions/setup-java@v4
              with:
                  java-version: '17'
                  distribution: temurin
                  server-id: github
                  server-username: GITHUB_ACTOR
                  server-password: GITHUB_TOKEN

            - name: Publish to GitHub Packages
              working-directory: libs/${{ needs.release-info.outputs.library }}
              run: ./mvnw deploy
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

